services:
  # 本機開發／E2E 用 Postgres（正式環境為 Neon，見 issue #4）
  # `npm run dev` 會透過 predev 自動拉起；手動：docker compose up -d --wait db
  db:
    image: postgres:17-alpine
    container_name: wedding-host-db
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
      POSTGRES_DB: wedding
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wedding -d wedding]
      interval: 2s
      timeout: 3s
      retries: 15

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    # 專案名稱與 tag 由 .env 控制，換專案只需改 .env，不用動此檔
    image: ${PROJECT_NAME:-nuxt-app}-frontend:${IMAGE_TAG:-latest}
    container_name: ${PROJECT_NAME:-nuxt-app}-frontend
    ports:
      - '${HOST_PORT:-3000}:3000'
    environment:
      NUXT_APP_BASE_URL: ${NUXT_APP_BASE_URL}
      NUXT_APP_BASE_API_URL: ${NUXT_APP_BASE_API_URL}
      NUXT_PRIVATE_GOOGLE_SHEET_KEY: ${NUXT_PRIVATE_GOOGLE_SHEET_KEY}
    restart: unless-stopped

volumes:
  db-data:
