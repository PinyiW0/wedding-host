name: Pull Request CI/CD

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.22.0]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      # 快速守門先行（數十秒內），紅燈即擋 PR，不用等 build
      - name: Unit test
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Test
        run: npm run eslint
