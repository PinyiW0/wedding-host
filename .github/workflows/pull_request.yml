name: Pull Request CI/CD

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一個 PR 連續 push 只留最後一次 run；被取消的 run 狀態是 cancelled，不是紅燈
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.22.0]

    steps:
      # action 一律釘 commit SHA（非可變 tag）：tag 可被上游移動，
      # 惡意版本會在持有 secrets 的 job 內執行。升版時連同註解的版本號一起更新。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      # 快速守門先行（數十秒內），紅燈即擋 PR，不用等 build
      - name: Unit test
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Test
        run: npm run eslint

  # E2E gate 全量（production build）——分級（SSOT：.claude/skills/vibe-check/SKILL.md）裡最慢的一級只在這裡跑：
  # 本機 pre-push 只跑煙霧、/vibe-check 預設定向，「改 A 有沒有壞 B」的完整回歸靠這三個 job。
  # 與本機 /vibe-check --full 的 dev 全量互不取代：hydration 警告只在 dev build 會印。
  # 拆法：build-e2e 建置一次上傳 .output → e2e 4 個 shard 各自下載、各起一台 Postgres＋server 平行跑 → merge-e2e-report 合併報告。
  # 每個 shard 自己一套 DB＋server：reset 端點會 truncate 全表，共用同一個 DB 平行跑會互踩。
  # build-e2e 與 build 平行跑（本專案 build job 也是 nuxt build，串起來只是多等一次建置）；
  # e2e 同時 needs build → unit／build／eslint 紅就不燒 E2E 分鐘。
  build-e2e:
    runs-on: ubuntu-latest
    outputs:
      has_specs: ${{ steps.specs.outputs.has_specs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 前置檢查與 .husky/pre-push、/vibe-check 同一套邏輯：gate 範圍沒有 spec 檔就放行。
      # 刻意不用 --pass-with-no-tests——那會讓「config 壞掉收不到測試」也靜默綠燈。
      - name: Detect gate specs
        id: specs
        run: |
          gate_specs=$(find test/e2e/specs test/e2e/vibe -name '*.spec.ts' -not -path '*/vibe/unstable/*' 2>/dev/null || true)
          if [ -z "$gate_specs" ]; then
            echo "⚠️  尚無 gate 測試檔（test/e2e/specs｜vibe/*.spec.ts）→ 跳過 E2E gate。"
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 22.22.0
        if: steps.specs.outputs.has_specs == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install
        if: steps.specs.outputs.has_specs == 'true'
        run: npm ci

      - name: Build (production)
        if: steps.specs.outputs.has_specs == 'true'
        run: npm run build

      # include-hidden-files：.output 是點開頭目錄，upload-artifact v4.4 起預設排除，不開會上傳空的
      - name: Upload build output
        if: steps.specs.outputs.has_specs == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-output
          path: .output/
          include-hidden-files: true
          retention-days: 1

  # shard 數固定 4；改 shard 數時 matrix 與 --shard 的分母兩處要一致。
  # fail-fast: false：一個 shard 紅不要取消其他 shard，才拿得到完整紅燈清單。
  e2e:
    needs: [build, build-e2e]
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 每個 shard 一個一次性 Postgres（與 scripts/docker-gate.sh 同帳密、同 major 版本）
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding
          POSTGRES_DB: wedding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wedding -d wedding"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      NUXT_DATABASE_URL: postgresql://wedding:wedding@127.0.0.1:5432/wedding
    steps:
      - name: No gate specs
        if: needs.build-e2e.outputs.has_specs != 'true'
        run: echo "⚠️  無 spec：尚無 gate 測試檔 → shard ${{ matrix.shard }}/4 跳過。"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.build-e2e.outputs.has_specs == 'true'

      - name: Use Node.js 22.22.0
        if: needs.build-e2e.outputs.has_specs == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm

      # 仍要 npm ci：Playwright、drizzle-kit 與 spec 的 import 來自 node_modules；.output 本身自帶執行期依賴
      - name: Install
        if: needs.build-e2e.outputs.has_specs == 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: needs.build-e2e.outputs.has_specs == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: needs.build-e2e.outputs.has_specs == 'true'
        run: npx playwright install --with-deps chromium

      - name: Download build output
        if: needs.build-e2e.outputs.has_specs == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-output
          path: .output/

      # production 的 ensureDbReady 是 no-op（不 migrate 不 seed）：先建表；seed 由 spec beforeEach 打 reset 完成
      - name: Migrate test DB
        if: needs.build-e2e.outputs.has_specs == 'true'
        run: npx drizzle-kit migrate

      # 環境變數對齊 scripts/docker-gate.sh 與 playwright.config.ts 的 webServer.env：
      # - NUXT_AUTH_MODE=open：production 預設 enforced 會擋凍結 spec 的裸 URL／無 token 直打，
      #   reset 端點也由 auth middleware 只在 open 模式放行。只在 CI 設，部署環境不得設
      # - NUXT_PUBLIC_API_BASE=''：E2E_BASE_URL 模式不掛 webServer，那裡的同源保險套不到這台 server，在此明鎖
      #   （本專案 apiBase 是 ofetch baseURL、路徑自帶 /api，同源值是空字串）
      # - LINE 三項清空：維持 mock（batch-send 不真發送、bind 頁不導向 LINE 授權）
      - name: Start production server
        if: needs.build-e2e.outputs.has_specs == 'true'
        env:
          NUXT_AUTH_MODE: open
          NUXT_PUBLIC_API_BASE: ''
          NUXT_LINE_CHANNEL_ACCESS_TOKEN: ''
          NUXT_LINE_LOGIN_CHANNEL_ID: ''
          NUXT_LINE_LOGIN_CHANNEL_SECRET: ''
          HOST: 127.0.0.1
          PORT: '3000'
        run: |
          node .output/server/index.mjs > server.log 2>&1 &
          # 不用 curl -f：server 回任何 HTTP 狀態就算 ready。
          # 上限是「絕對期限 60 秒」，不是迴圈次數：接了連線卻不回應時每次 curl 會等到 --max-time，
          # 用次數當上限會被乘成好幾分鐘。單次探測只給剩餘秒數（最多 5 秒），到期就停。
          start=$(date +%s); deadline=$(( start + 60 ))
          while :; do
            now=$(date +%s); rem=$(( deadline - now ))
            [ "$rem" -gt 0 ] || break
            [ "$rem" -gt 5 ] && rem=5
            if curl -s --max-time "$rem" -o /dev/null http://127.0.0.1:3000/; then
              echo "server ready（$(( now - start ))s）"
              exit 0
            fi
            [ "$(date +%s)" -lt "$deadline" ] || break
            sleep 1
          done
          echo "❌ Server 60 秒內未 ready，server.log 最後 50 行："
          tail -n 50 server.log
          exit 1

      # config 在 CI 自動 retries: 1——一次紅、重跑綠的測試會標成 flaky，不會讓 job 紅；flaky 看合併後的 HTML 報告。
      # E2E_BASE_URL 存在時 config 不掛 webServer，直接打上面起好的 production server。
      # --reporter 覆蓋 config 的 list＋html：blob 給 merge-e2e-report 合併，list 留在 job log 看紅燈。
      - name: E2E gate (production build, shard ${{ matrix.shard }}/4)
        if: needs.build-e2e.outputs.has_specs == 'true'
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test --config playwright.gate.config.ts --shard=${{ matrix.shard }}/4 --reporter=blob,list

      # 失敗時 server.log 是唯一看得到 server 端錯誤的地方
      - name: Server log (on failure)
        if: ${{ failure() && needs.build-e2e.outputs.has_specs == 'true' }}
        run: tail -n 100 server.log || true

      # 不分紅綠都上傳：flaky（一紅一綠）時 job 是綠的，只在 failure() 上傳會拿不到 flaky 紀錄。
      # 用 !cancelled() 不用 always()：被 concurrency 取消的 run 沒有必要上傳。
      - name: Upload blob report
        if: ${{ !cancelled() && needs.build-e2e.outputs.has_specs == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
          # E2E 之前的步驟（下載／起 server）先失敗時沒有 blob，不要為此再多一條警告
          if-no-files-found: ignore

  # 4 份 blob 合併成一份 HTML（artifact 名稱 playwright-report-gate）。shard 紅也要跑，紅燈時才最需要報告。
  merge-e2e-report:
    needs: [build-e2e, e2e]
    if: ${{ !cancelled() && needs.build-e2e.outputs.has_specs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js 22.22.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          path: all-blob-reports/
          merge-multiple: true

      # 所有 shard 都在跑測試前就失敗時沒有 blob：略過合併，紅燈原因看各 shard 的 job log
      - name: Merge reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-gate
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          if ! ls all-blob-reports/*.zip >/dev/null 2>&1; then
            echo "⚠️  沒有任何 shard 產出 blob → 略過合併。"
            exit 0
          fi
          npx playwright merge-reports --reporter html all-blob-reports

      - name: Upload gate report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-gate
          path: playwright-report-gate/
          retention-days: 7
          if-no-files-found: ignore
